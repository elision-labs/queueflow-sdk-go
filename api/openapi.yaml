        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: Filter by task name (jobs and dead letters).
        explode: true
        in: query
        name: task_name
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Dead letters only: `false` lists entries not yet replayed, `true` the
          replayed ones; both when omitted.
        explode: true
        in: query
        name: replayed
        required: false
        schema:
          type: boolean
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      - description: |-
          Opaque keyset cursor from a previous page's `next_cursor`. When set,
          `offset` is ignored and listing continues where that page ended.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Only rows created at or after this instant (RFC 3339, inclusive).
          With `created_before` this forms the half-open range `[after, before)`
          — the natural shape for walking history period by period.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Only rows created strictly before this instant (RFC 3339, exclusive)."
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
