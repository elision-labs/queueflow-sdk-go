components:
  schemas:
    BackoffStrategy:
      description: How retry delays grow between attempts.
      enum:
      - fixed
      - linear
      - exponential
      type: string
    CancelJobsRequest:
      description: |-
        Which jobs a bulk cancel applies to. Every field is optional; an empty
        body cancels the caller's oldest non-terminal jobs up to `limit`.
      example:
        task_name: task_name
        created_after: 2000-01-23T04:56:07.000+00:00
        created_before: 2000-01-23T04:56:07.000+00:00
        limit: 0
        queue: queue
        status: status
      properties:
        created_after:
          description: "Only jobs created at or after this instant (RFC 3339, inclusive)."
          format: date-time
          nullable: true
          type: string
        created_before:
          description: "Only jobs created strictly before this instant (RFC 3339,\
            \ exclusive)."
          format: date-time
          nullable: true
          type: string
        limit:
          description: |-
            Cancel at most this many (oldest first). Default 100; the maximum is
            the server's batch limit (`--max-batch`, 1000 by default).
          format: int64
          nullable: true
          type: integer
        queue:
          description: Only jobs on this queue.
          nullable: true
          type: string
        status:
          description: |-
            Only jobs in this state: `pending`, `retrying` or `running` (all three
            when omitted). Terminal states are rejected: history is never
            rewritten.
          nullable: true
          type: string
        task_name:
          description: Only jobs for this task.
          nullable: true
          type: string
    CancelJobsResponse:
      example:
        cancelled: 0
      properties:
        cancelled:
          description: |-
            How many jobs this call cancelled. Less than `limit` means the
            matching set is exhausted (jobs finishing concurrently are left as
            they ended, never overwritten).
          format: int64
          minimum: 0
          type: integer
      required:
      - cancelled
    CompleteJobRequest:
      description: "Body for `POST /api/v1/jobs/{id}/complete`."
      example:
        result:
          key: ""
        lease_token: lease_token
      properties:
        lease_token:
          description: The lease token returned by the lease call.
          type: string
        result:
          additionalProperties: {}
          description: "Handler result, recorded on the job and merged into workflow\
            \ context."
      required:
      - lease_token
    ConditionOp:
      description: "How a [`StepCondition`] leaf compares the value at `path` with\
        \ `value`."
      enum:
      - eq
      - ne
      - gt
      - gte
      - lt
      - lte
      - exists
      - contains
      - in
      type: string
    CreateBatchJobsRequest:
      example:
        jobs:
        - task_name: task_name
          payload:
            key: ""
          run_at: 2000-01-23T04:56:07.000+00:00
          config:
            max_retries: 0
            retry_max_delay_secs: 0
            retry_backoff: fixed
            priority: 1
            retry_delay_secs: 0
            jitter_factor: 0.8008281904610115
            queue: queue
            timeout: 0
        - task_name: task_name
          payload:
            key: ""
          run_at: 2000-01-23T04:56:07.000+00:00
          config:
            max_retries: 0
            retry_max_delay_secs: 0
            retry_backoff: fixed
            priority: 1
            retry_delay_secs: 0
            jitter_factor: 0.8008281904610115
            queue: queue
            timeout: 0
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/CreateJobRequest'
          type: array
      required:
      - jobs
    CreateBatchJobsResponse:
      example:
        job_ids:
        - job_ids
        - job_ids
        count: 0
      properties:
        count:
          minimum: 0
          type: integer
        job_ids:
          items:
            type: string
          type: array
      required:
      - count
      - job_ids
    CreateCronRequest:
      description: Request body for creating a cron schedule.
      example:
        task_name: task_name
        payload:
          key: ""
        cron_expr: cron_expr
        name: name
        config:
          max_retries: 0
          retry_max_delay_secs: 0
          retry_backoff: fixed
          priority: 1
          retry_delay_secs: 0
          jitter_factor: 0.8008281904610115
          timeout_secs: 0
        queue: queue
      properties:
        config:
          $ref: '#/components/schemas/JobConfig'
        cron_expr:
          description: 5-field crontab (UTC); 6/7 fields with leading seconds also
            accepted.
          type: string
        name:
          description: Unique per tenant.
          type: string
        payload:
          additionalProperties: {}
        queue:
          nullable: true
          type: string
        task_name:
          type: string
      required:
      - cron_expr
      - name
      - task_name
    CreateCronResponse:
      example:
        cron_id: cron_id
      properties:
        cron_id:
          type: string
      required:
      - cron_id
    CreateJobRequest:
      example:
        task_name: task_name
        payload:
          key: ""
        run_at: 2000-01-23T04:56:07.000+00:00
        config:
          max_retries: 0
          retry_max_delay_secs: 0
          retry_backoff: fixed
          priority: 1
          retry_delay_secs: 0
          jitter_factor: 0.8008281904610115
          queue: queue
          timeout: 0
      properties:
        config:
          $ref: '#/components/schemas/JobConfigRequest'
        payload:
          additionalProperties: {}
          description: Arbitrary JSON object passed to the handler.
        run_at:
          description: |-
            Don't run before this instant (RFC 3339). The job is created
            immediately but stays invisible to workers until then.
          format: date-time
          nullable: true
          type: string
        task_name:
          description: The registered task handler to invoke.
          type: string
      required:
      - task_name
    CreateJobResponse:
      example:
        job_id: job_id
      properties:
        job_id:
          type: string
      required:
      - job_id
    CreateWorkflowRequest:
      description: |-
        Request body for creating a workflow. Shared by the builder DSL and the API
        so callers and SDKs use the same contract.
      example:
        metadata:
          key: ""
        context:
          key: ""
        name: name
        steps:
        - null
        - null
        timeout_secs: 0
      properties:
        context:
          additionalProperties: {}
        metadata:
          additionalProperties: {}
        name:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/WorkflowStep'
          type: array
        timeout_secs:
          description: |-
            Whole-workflow time budget in seconds. When it runs out the janitor
            cancels every unfinished step and fails the workflow with
            `workflow timed out`. Unset means no limit.
          format: int64
          minimum: 0
          nullable: true
          type: integer
      required:
      - name
      - steps
    CreateWorkflowResponse:
      example:
        workflow_id: workflow_id
      properties:
        workflow_id:
          type: string
      required:
      - workflow_id
    CronSchedule:
      description: |-
        A recurring enqueue schedule. Expressions are standard 5-field crontab
        (`minute hour day-of-month month day-of-week`), evaluated in **UTC**; a
        6/7-field form with leading seconds is also accepted.
      example:
        queue_name: queue_name
        task_name: task_name
        tenant_id: tenant_id
        next_run_at: 2000-01-23T04:56:07.000+00:00
        payload:
          key: ""
        cron_expr: cron_expr
        last_enqueued_at: 2000-01-23T04:56:07.000+00:00
        name: name
