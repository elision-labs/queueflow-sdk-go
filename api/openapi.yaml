        all:
          description: True when every member is true.
          items:
            $ref: '#/components/schemas/StepCondition'
          nullable: true
          type: array
        any:
          description: True when at least one member is true.
          items:
            $ref: '#/components/schemas/StepCondition'
          nullable: true
          type: array
        not:
          $ref: '#/components/schemas/StepCondition'
        op:
          $ref: '#/components/schemas/ConditionOp'
        path:
          nullable: true
          type: string
        value:
          nullable: true
          type: object
