components:
  schemas:
    BackoffStrategy:
      description: How retry delays grow between attempts.
      enum:
      - fixed
      - linear
      - exponential
      type: string
    CompleteJobRequest:
      description: "Body for `POST /api/v1/jobs/{id}/complete`."
      example:
        result:
          key: ""
        lease_token: lease_token
      properties:
        lease_token:
          description: The lease token returned by the lease call.
          type: string
        result:
          additionalProperties: {}
          description: "Handler result, recorded on the job and merged into workflow\
            \ context."
      required:
      - lease_token
    CreateBatchJobsRequest:
      example:
        jobs:
        - task_name: task_name
          payload:
            key: ""
          run_at: 2000-01-23T04:56:07.000+00:00
          config:
            max_retries: 0
            priority: 6
            queue: queue
            timeout: 0
        - task_name: task_name
          payload:
            key: ""
          run_at: 2000-01-23T04:56:07.000+00:00
          config:
            max_retries: 0
            priority: 6
            queue: queue
            timeout: 0
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/CreateJobRequest'
          type: array
      required:
      - jobs
    CreateBatchJobsResponse:
      example:
        job_ids:
        - job_ids
        - job_ids
        count: 0
      properties:
        count:
          minimum: 0
          type: integer
        job_ids:
          items:
            type: string
          type: array
      required:
      - count
      - job_ids
    CreateCronRequest:
      description: Request body for creating a cron schedule.
      example:
        task_name: task_name
        payload:
          key: ""
        cron_expr: cron_expr
        name: name
        config:
          max_retries: 0
          retry_max_delay_secs: 0
          retry_backoff: fixed
          priority: 1
          retry_delay_secs: 0
          jitter_factor: 0.8008281904610115
          timeout_secs: 0
        queue: queue
      properties:
        config:
          $ref: '#/components/schemas/JobConfig'
        cron_expr:
          description: 5-field crontab (UTC); 6/7 fields with leading seconds also
            accepted.
          type: string
        name:
          description: Unique per tenant.
          type: string
        payload:
          additionalProperties: {}
        queue:
          nullable: true
          type: string
        task_name:
          type: string
      required:
      - cron_expr
      - name
      - task_name
    CreateCronResponse:
      example:
        cron_id: cron_id
      properties:
        cron_id:
          type: string
      required:
      - cron_id
    CreateJobRequest:
      example:
        task_name: task_name
        payload:
          key: ""
        run_at: 2000-01-23T04:56:07.000+00:00
        config:
          max_retries: 0
          priority: 6
          queue: queue
          timeout: 0
      properties:
        config:
          $ref: '#/components/schemas/JobConfigRequest'
        payload:
          additionalProperties: {}
          description: Arbitrary JSON object passed to the handler.
        run_at:
          description: |-
            Don't run before this instant (RFC 3339). The job is created
            immediately but stays invisible to workers until then.
          format: date-time
          nullable: true
          type: string
        task_name:
          description: The registered task handler to invoke.
          type: string
      required:
      - task_name
    CreateJobResponse:
      example:
        job_id: job_id
      properties:
        job_id:
          type: string
      required:
      - job_id
    CreateWorkflowRequest:
      description: |-
        Request body for creating a workflow. Shared by the builder DSL and the API
        so callers and SDKs use the same contract.
      example:
        metadata:
          key: ""
        context:
          key: ""
        name: name
        steps:
        - task_name: task_name
          on_failure: halt
          metadata:
            key: ""
          depends_on:
          - depends_on
          - depends_on
          payload:
            key: ""
          on_success: continue
          name: name
          config:
            max_retries: 0
            retry_max_delay_secs: 0
            retry_backoff: fixed
            priority: 1
            retry_delay_secs: 0
            jitter_factor: 0.8008281904610115
            timeout_secs: 0
        - task_name: task_name
          on_failure: halt
          metadata:
            key: ""
          depends_on:
          - depends_on
          - depends_on
          payload:
            key: ""
          on_success: continue
          name: name
          config:
            max_retries: 0
            retry_max_delay_secs: 0
            retry_backoff: fixed
            priority: 1
            retry_delay_secs: 0
            jitter_factor: 0.8008281904610115
            timeout_secs: 0
      properties:
        context:
          additionalProperties: {}
        metadata:
          additionalProperties: {}
        name:
          type: string
        steps:
          items:
            $ref: '#/components/schemas/WorkflowStep'
          type: array
      required:
      - name
      - steps
    CreateWorkflowResponse:
      example:
        workflow_id: workflow_id
      properties:
        workflow_id:
          type: string
      required:
      - workflow_id
    CronSchedule:
      description: |-
        A recurring enqueue schedule. Expressions are standard 5-field crontab
        (`minute hour day-of-month month day-of-week`), evaluated in **UTC**; a
        6/7-field form with leading seconds is also accepted.
      example:
        queue_name: queue_name
        task_name: task_name
        tenant_id: tenant_id
        next_run_at: 2000-01-23T04:56:07.000+00:00
        payload:
          key: ""
        cron_expr: cron_expr
        last_enqueued_at: 2000-01-23T04:56:07.000+00:00
        name: name
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        config:
          max_retries: 0
          retry_max_delay_secs: 0
          retry_backoff: fixed
          priority: 1
          retry_delay_secs: 0
          jitter_factor: 0.8008281904610115
          timeout_secs: 0
        enabled: true
      properties:
        config:
          $ref: '#/components/schemas/JobConfig'
        created_at:
          format: date-time
          type: string
        cron_expr:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        last_enqueued_at:
          format: date-time
          nullable: true
          type: string
        name:
          description: Unique per tenant.
          type: string
        next_run_at:
          description: |-
            The next instant this schedule fires. Missed occurrences (server
            down) collapse into at most one catch-up firing.
          format: date-time
          type: string
        payload:
          additionalProperties: {}
        queue_name:
          description: Queue for the enqueued jobs (the engine default when absent).
          nullable: true
          type: string
        task_name:
          type: string
        tenant_id:
          nullable: true
          type: string
      required:
      - created_at
      - cron_expr
      - enabled
      - id
      - name
      - next_run_at
      - task_name
    DeadLetter:
      description: |-
        A dead-lettered job: a terminal failure recorded for inspection and
        replay. The original job row remains (subject to retention); this entry
        captures why it died and, once replayed, which fresh job took its place.
      example:
        error_message: error_message
        queue_name: queue_name
        task_name: task_name
        tenant_id: tenant_id
        reason: reason
        replay_job_id: replay_job_id
        job_id: job_id
        created_at: 2000-01-23T04:56:07.000+00:00
        replayed_at: 2000-01-23T04:56:07.000+00:00
        id: 0
      properties:
        created_at:
          format: date-time
          type: string
        error_message:
          nullable: true
          type: string
        id:
          format: int64
          type: integer
        job_id:
          type: string
        queue_name:
          nullable: true
          type: string
        reason:
          description: |-
            Why the job dead-lettered: `max_attempts_exceeded`, `non_retryable`,
            or `handler_not_found`.
          type: string
        replay_job_id:
          description: The fresh job created by the replay.
          nullable: true
          type: string
        replayed_at:
          description: |-
            Set once this entry has been replayed; a dead letter replays at most
            once.
          format: date-time
          nullable: true
          type: string
        task_name:
          nullable: true
          type: string
        tenant_id:
          nullable: true
          type: string
      required:
      - created_at
      - id
      - job_id
      - reason
    ErrorBody:
      example:
        error: error
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        error:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - error
      - timestamp
    FailJobRequest:
      description: "Body for `POST /api/v1/jobs/{id}/fail`."
      example:
        retryable: true
        lease_token: lease_token
        error: error
      properties:
        error:
          description: Human-readable failure reason.
          type: string
        lease_token:
          description: The lease token returned by the lease call.
          type: string
        retryable:
          description: |-
            Whether the engine may retry (subject to the job's max_retries).
            Defaults to true; send false for permanent failures (e.g. bad input).
          type: boolean
      required:
      - error
      - lease_token
    HealthStatus:
      example:
        version: version
        status: status
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        status:
          type: string
        timestamp:
          format: date-time
          type: string
        version:
          type: string
      required:
      - status
      - timestamp
      - version
    HeartbeatRequest:
      description: "Body for `POST /api/v1/jobs/{id}/heartbeat`."
      example:
        extend_secs: 0
        lease_token: lease_token
      properties:
        extend_secs:
          description: "New lease duration in seconds, measured from now (1..=3600)."
          format: int32
          minimum: 0
          type: integer
        lease_token:
          description: The lease token returned by the lease call.
          type: string
      required:
      - extend_secs
      - lease_token
    HeartbeatResponse:
      description: "Response for `POST /api/v1/jobs/{id}/heartbeat`."
      example:
        status: pending
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
      required:
      - status
    Job:
      description: A single unit of work.
      example:
        error_message: error_message
        task_name: task_name
        tenant_id: tenant_id
        metadata:
          key: ""
        workflow_id: workflow_id
        created_at: 2000-01-23T04:56:07.000+00:00
        scheduled_at: 2000-01-23T04:56:07.000+00:00
        delivery_count: 0
        queue_name: queue_name
        result:
          key: ""
        completed_at: 2000-01-23T04:56:07.000+00:00
        payload:
          key: ""
        retry_count: 0
        idempotency_key: idempotency_key
        next_retry_at: 2000-01-23T04:56:07.000+00:00
        started_at: 2000-01-23T04:56:07.000+00:00
        id: id
        workflow_step_id: workflow_step_id
        config:
          max_retries: 0
          retry_max_delay_secs: 0
          retry_backoff: fixed
          priority: 1
          retry_delay_secs: 0
          jitter_factor: 0.8008281904610115
          timeout_secs: 0
        status: pending
      properties:
        completed_at:
          format: date-time
          nullable: true
          type: string
        config:
          $ref: '#/components/schemas/JobConfig'
        created_at:
          format: date-time
          type: string
        delivery_count:
          description: |-
            How many times this job has been claimed (delivered to a worker).
            Greater than `retry_count + 1` means a lease expired without a report —
            i.e. a worker crashed mid-run.
          format: int32
          minimum: 0
          type: integer
        error_message:
          nullable: true
          type: string
        id:
          type: string
        idempotency_key:
          description: |-
            Client-supplied key that makes job creation idempotent per tenant:
            re-submitting the same key returns the original job instead of creating
            a duplicate.
          nullable: true
          type: string
        metadata:
          additionalProperties: {}
        next_retry_at:
          description: |-
            When this job's next retry becomes claimable (mirrors `scheduled_at`
            while the job is `retrying`; kept for audit/inspection).
          format: date-time
          nullable: true
          type: string
        payload:
          additionalProperties: {}
        queue_name:
          type: string
        result:
          additionalProperties: {}
        retry_count:
          format: int32
          minimum: 0
          type: integer
        scheduled_at:
          description: |-
            When the job becomes claimable. `created_at` for immediate jobs, the
            requested `run_at` for scheduled jobs, and the next backoff instant
            while retrying — the durable delay lives in the row itself.
          format: date-time
          type: string
        started_at:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        task_name:
          type: string
        tenant_id:
          nullable: true
          type: string
        workflow_id:
          nullable: true
          type: string
        workflow_step_id:
          description: The owning workflow step's name (steps are addressed by name).
          nullable: true
          type: string
      required:
      - config
      - created_at
      - id
      - queue_name
      - retry_count
      - scheduled_at
      - status
      - task_name
    JobConfig:
      description: Per-job execution configuration. All durations are in seconds.
      example:
        max_retries: 0
        retry_max_delay_secs: 0
        retry_backoff: fixed
        priority: 1
        retry_delay_secs: 0
        jitter_factor: 0.8008281904610115
        timeout_secs: 0
      properties:
        jitter_factor:
          description: |-
            Optional jitter in `0.0..=1.0`. `0.1` => +/-10% randomization of each
            retry delay, which spreads out thundering-herd retries.
          format: double
          nullable: true
          type: number
        max_retries:
          format: int32
          minimum: 0
          type: integer
        priority:
          description: |-
            Higher is claimed first within a queue; ties break on `scheduled_at`,
            then `created_at`.
          format: int32
          type: integer
        retry_backoff:
          $ref: '#/components/schemas/BackoffStrategy'
        retry_delay_secs:
          format: int64
          minimum: 0
          type: integer
        retry_max_delay_secs:
          format: int64
          minimum: 0
          type: integer
        timeout_secs:
          format: int64
          minimum: 0
          type: integer
      required:
      - max_retries
      - priority
      - retry_delay_secs
      - retry_max_delay_secs
      - timeout_secs
    JobConfigRequest:
      description: Optional per-job configuration overrides.
      example:
        max_retries: 0
        priority: 6
        queue: queue
        timeout: 0
      properties:
        max_retries:
          format: int32
          minimum: 0
          nullable: true
          type: integer
        priority:
          description: "Higher is claimed first within a queue (ties: oldest first)."
          format: int32
          nullable: true
          type: integer
        queue:
          description: Override the destination queue.
          nullable: true
          type: string
        timeout:
          description: "Per-attempt timeout, in seconds."
          format: int64
          minimum: 0
          nullable: true
          type: integer
    JobStatus:
      description: Lifecycle state of a single job.
      enum:
      - pending
      - running
      - completed
      - failed
      - retrying
      - cancelled
      type: string
    LeaseJobsRequest:
      description: "Body for `POST /api/v1/queues/{queue}/lease`."
      example:
        lease_secs: 0
        wait_secs: 0
        max_jobs: 0
      properties:
        lease_secs:
          description: "Lease duration in seconds (1..=3600, default 30). Heartbeat\
            \ to extend."
          format: int32
          minimum: 0
          nullable: true
          type: integer
        max_jobs:
          description: "Maximum jobs to lease in one call (1..=100, default 1)."
          minimum: 0
          nullable: true
          type: integer
        wait_secs:
          description: "Long-poll wait when the queue is empty, in seconds (0..=30,\
            \ default 0)."
          format: int32
          minimum: 0
          nullable: true
          type: integer
    LeaseJobsResponse:
      example:
        jobs:
        - lease_token: lease_token
          job:
            error_message: error_message
            task_name: task_name
            tenant_id: tenant_id
            metadata:
              key: ""
