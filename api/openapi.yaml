openapi: 3.1.0
info:
  contact:
    name: QueueFlow
    url: https://queueflow.dev
  description: "REST API for QueueFlow, a PostgreSQL-native distributed job queue\
    \ and workflow engine."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: QueueFlow API
  version: 1.0.0
servers:
- description: Local development
  url: http://localhost:8000
- description: Production
  url: https://api.queueflow.dev
tags:
- description: Liveness and readiness probes
  name: health
- description: Job lifecycle
  name: jobs
- description: Workflow orchestration (DAG of steps)
  name: workflows
- description: Recurring enqueues on a cron schedule (UTC)
  name: cron
- description: "Dead-letter queue: inspect terminally-failed jobs and replay them\
    \ as fresh jobs"
  name: dlq
- description: "Remote worker protocol: lease jobs, heartbeat, report completion/failure.\
    \ Lets handlers run in any language, outside the server binary."
  name: worker
- description: Introspection and metrics
  name: system
paths:
  /api/v1/cron:
    get:
      operationId: listCrons
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCronsResponse'
          description: Page of cron schedules (`status`/`queue` filters do not apply)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - cron
    post:
      operationId: createCron
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCronRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCronResponse'
          description: Schedule created; first firing is the next occurrence (UTC)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request (e.g. a bad cron expression)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: A schedule with this name already exists
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}:
    delete:
      operationId: deleteCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Deleted; already-enqueued jobs are unaffected
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
    get:
      operationId: getCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronSchedule'
          description: Cron schedule
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}/pause:
    post:
      operationId: pauseCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: "Paused: no further firings until resumed"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}/resume:
    post:
      operationId: resumeCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: "Resumed: fires at its next future occurrence (missed runs\
            \ are not caught up)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/dlq:
    get:
      operationId: listDeadLetters
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeadLettersResponse'
          description: "Page of dead letters, newest first (the `status` filter does\
            \ not apply)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/dlq/{id}:
    get:
      operationId: getDeadLetter
      parameters:
      - description: Dead letter id
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
          description: Dead letter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/dlq/{id}/replay:
    post:
      operationId: replayDeadLetter
      parameters:
      - description: Dead letter id
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayDeadLetterResponse'
          description: A fresh job was created from the dead-lettered one (same task/payload/queue/config;
            workflow linkage is not resurrected)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Not found (the entry, or its original job after retention)"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Already replayed
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/jobs:
    get:
      operationId: listJobs
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
          description: Page of jobs
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
    post:
      operationId: createJob
      parameters:
      - description: "Optional client-supplied key making this create idempotent per\
          \ tenant: retrying with the same key returns the original job instead of\
          \ creating a duplicate."
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
          description: Job created (or replayed idempotently)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/batch:
    post:
      operationId: createBatchJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchJobsRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchJobsResponse'
          description: Jobs created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: Job
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Cancelled
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}/complete:
    post:
      operationId: completeJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
        required: true
      responses:
        "204":
          description: "Completed (idempotent: replaying against an already-finished\
            \ job also succeeds)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Lease no longer held (expired and reclaimed)
      security:
      - bearerAuth: []
      tags:
      - worker
  /api/v1/jobs/{id}/events:
    get:
      operationId: streamJobEvents
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream; each `status` event carries the full job JSON.
            Closes after the job reaches a terminal state.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      summary: |-
        Stream a job's status transitions as Server-Sent Events until it reaches a
        terminal state. Lets clients await completion without polling the REST
        endpoint themselves.
      tags:
      - jobs
  /api/v1/jobs/{id}/fail:
    post:
      operationId: failJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailJobRequest'
        required: true
      responses:
        "204":
          description: Failure recorded; the job is retried or dead-lettered per its
            config
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Lease no longer held (expired and reclaimed)
      security:
      - bearerAuth: []
      tags:
      - worker
  /api/v1/jobs/{id}/heartbeat:
    post:
      operationId: heartbeatJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
          description: "Current job status. `running` = lease extended; anything else\
            \ (e.g. `cancelled`) = not extended, stop working on the job."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Lease no longer held (expired and reclaimed)
      security:
      - bearerAuth: []
      tags:
      - worker
  /api/v1/queues/{queue}/lease:
    post:
      operationId: leaseJobs
      parameters:
      - description: Queue to lease from
        explode: false
        in: path
        name: queue
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseJobsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseJobsResponse'
          description: Zero or more leased jobs (empty if none became available within
            wait_secs)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
      security:
      - bearerAuth: []
      tags:
      - worker
  /api/v1/stats:
    get:
      operationId: getStats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSnapshot'
          description: "Engine counters. Process-local and reset on restart: in a\
            \ split api/worker deployment this reflects only the process serving the\
            \ request; query the database for fleet-wide history."
      security:
      - bearerAuth: []
      tags:
      - system
  /api/v1/tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
          description: Registered task handlers
      security:
      - bearerAuth: []
      tags:
      - system
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
          description: Page of workflows
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - workflows
    post:
      operationId: createWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
          description: Workflow created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid workflow (e.g. dependency cycle)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
