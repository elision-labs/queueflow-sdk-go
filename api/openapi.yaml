      - running
    QueueStats:
      description: |-
        Live, per-queue backlog figures read from the store: what an operator
        watches to decide whether to add workers. Only non-terminal jobs are
        counted, so the query stays cheap on a large history table. Durable
        totals live in [`StatsSnapshot`] via `JobStore::count_stats`.
      example:
        running: 0
        paused: true
        scheduled: 0
        pending: 0
        oldest_pending_age_secs: 0
        queue: queue
      properties:
        oldest_pending_age_secs:
          description: |-
            Seconds the oldest claimable job has been waiting, `None` when nothing
            is claimable. The queue's primary health signal: it grows when workers
            cannot keep up and stays near zero when they can.
          format: int64
          minimum: 0
          nullable: true
          type: integer
        paused:
          description: |-
            Claims for this tenant's jobs on the queue are paused (see
            `POST /api/v1/queues/{queue}/pause`). Pending jobs accumulate; running
            ones finish. In the all-tenants view this is true only when every
            registered tenant of the queue is paused.
          type: boolean
        pending:
          description: "Claimable now: `pending` or `retrying` with `scheduled_at`\
            \ in the past."
          format: int64
          minimum: 0
          type: integer
        queue:
          type: string
        running:
          description: Currently leased by a worker.
          format: int64
          minimum: 0
          type: integer
        scheduled:
          description: Waiting for a future `scheduled_at` (a `run_at` job or a backoff
            retry).
          format: int64
          minimum: 0
          type: integer
