openapi: 3.1.0
info:
  contact:
    name: QueueFlow
    url: https://queueflow.dev
  description: "REST API for QueueFlow, a PostgreSQL-native distributed job queue\
    \ and workflow engine."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: QueueFlow API
  version: 0.6.0
servers:
- description: Local development
  url: http://localhost:8000
- description: Production
  url: https://api.queueflow.dev
tags:
- description: Liveness and readiness probes
  name: health
- description: Job lifecycle
  name: jobs
- description: Workflow orchestration (DAG of steps)
  name: workflows
- description: Recurring enqueues on a cron schedule (UTC)
  name: cron
- description: "Dead-letter queue: inspect terminally-failed jobs and replay them\
    \ as fresh jobs"
  name: dlq
- description: "Remote worker protocol: lease jobs, heartbeat, report completion/failure.\
    \ Lets handlers run in any language, outside the server binary."
  name: worker
- description: Introspection and metrics
  name: system
paths:
  /api/v1/cron:
    get:
      operationId: listCrons
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: Filter by task name (jobs and dead letters).
        explode: true
        in: query
        name: task_name
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Dead letters only: `false` lists entries not yet replayed, `true` the
          replayed ones; both when omitted.
        explode: true
        in: query
        name: replayed
        required: false
        schema:
          type: boolean
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      - description: |-
          Opaque keyset cursor from a previous page's `next_cursor`. When set,
          `offset` is ignored and listing continues where that page ended.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Only rows created at or after this instant (RFC 3339, inclusive).
          With `created_before` this forms the half-open range `[after, before)`
          — the natural shape for walking history period by period.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Only rows created strictly before this instant (RFC 3339, exclusive)."
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCronsResponse'
          description: Page of cron schedules (`status`/`queue` filters do not apply)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - cron
    post:
      operationId: createCron
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCronRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCronResponse'
          description: Schedule created; first firing is the next occurrence (UTC)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request (e.g. a bad cron expression)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: A schedule with this name already exists
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}:
    delete:
      operationId: deleteCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Deleted; already-enqueued jobs are unaffected
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
    get:
      operationId: getCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronSchedule'
          description: Cron schedule
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}/pause:
    post:
      operationId: pauseCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: "Paused: no further firings until resumed"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/cron/{id}/resume:
    post:
      operationId: resumeCron
      parameters:
      - description: Cron schedule id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: "Resumed: fires at its next future occurrence (missed runs\
            \ are not caught up)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - cron
  /api/v1/dlq:
    get:
      operationId: listDeadLetters
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: Filter by task name (jobs and dead letters).
        explode: true
        in: query
        name: task_name
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Dead letters only: `false` lists entries not yet replayed, `true` the
          replayed ones; both when omitted.
        explode: true
        in: query
        name: replayed
        required: false
        schema:
          type: boolean
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      - description: |-
          Opaque keyset cursor from a previous page's `next_cursor`. When set,
          `offset` is ignored and listing continues where that page ended.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Only rows created at or after this instant (RFC 3339, inclusive).
          With `created_before` this forms the half-open range `[after, before)`
          — the natural shape for walking history period by period.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Only rows created strictly before this instant (RFC 3339, exclusive)."
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeadLettersResponse'
          description: "Page of dead letters, newest first. `queue`, `task_name`,\
            \ `replayed` and the time window apply; `status` does not."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/dlq/replay:
    post:
      operationId: replayDeadLetters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayDeadLettersRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayDeadLettersResponse'
          description: "Every unreplayed dead letter matching the filter (oldest first,\
            \ up to `limit`) was replayed as a fresh job, or is listed with the reason\
            \ it could not be."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/dlq/{id}:
    get:
      operationId: getDeadLetter
      parameters:
      - description: Dead letter id
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
          description: Dead letter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/dlq/{id}/replay:
    post:
      operationId: replayDeadLetter
      parameters:
      - description: Dead letter id
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayDeadLetterResponse'
          description: A fresh job was created from the dead-lettered one (same task/payload/queue/config;
            workflow linkage is not resurrected)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Not found (the entry, or its original job after retention)"
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Already replayed
      security:
      - bearerAuth: []
      tags:
      - dlq
  /api/v1/jobs:
    get:
      operationId: listJobs
      parameters:
      - description: "Filter by status (e.g. `pending`, `completed`)."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by queue name (jobs only).
        explode: true
        in: query
        name: queue
        required: false
        schema:
          type: string
        style: form
      - description: Filter by task name (jobs and dead letters).
        explode: true
        in: query
        name: task_name
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Dead letters only: `false` lists entries not yet replayed, `true` the
          replayed ones; both when omitted.
        explode: true
        in: query
        name: replayed
        required: false
        schema:
          type: boolean
        style: form
      - description: "Page size, 1..=100 (default 50)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Number of records to skip (default 0).
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: '`created_at ASC` or `created_at DESC` (default DESC).'
        explode: true
        in: query
        name: order_by
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Include the exact `total` count in the response (default false; the
          count is an extra full scan over the filtered set).
        explode: true
        in: query
        name: include_total
        required: false
        schema:
          type: boolean
        style: form
      - description: |-
          Opaque keyset cursor from a previous page's `next_cursor`. When set,
          `offset` is ignored and listing continues where that page ended.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Only rows created at or after this instant (RFC 3339, inclusive).
          With `created_before` this forms the half-open range `[after, before)`
          — the natural shape for walking history period by period.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Only rows created strictly before this instant (RFC 3339, exclusive)."
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
          description: Page of jobs
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
    post:
      operationId: createJob
      parameters:
      - description: "Optional client-supplied key making this create idempotent per\
          \ tenant: retrying with the same key returns the original job instead of\
          \ creating a duplicate."
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
          description: Job created (or replayed idempotently)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/batch:
    post:
      operationId: createBatchJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchJobsRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchJobsResponse'
          description: Jobs created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/cancel:
    post:
      operationId: cancelJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobsResponse'
          description: "Matching non-terminal jobs of the caller's tenant were cancelled,\
            \ oldest first, up to `limit`. Repeat until `cancelled` is below `limit`\
            \ to drain a large set."
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Invalid filter (for example a terminal status)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: Job
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Cancelled
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      tags:
      - jobs
  /api/v1/jobs/{id}/complete:
    post:
      operationId: completeJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
        required: true
      responses:
        "204":
          description: "Completed (idempotent: replaying against an already-finished\
            \ job also succeeds)"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Lease no longer held (expired and reclaimed)
      security:
      - bearerAuth: []
      tags:
      - worker
  /api/v1/jobs/{id}/events:
    get:
      operationId: streamJobEvents
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream; each `status` event carries the full job JSON.
            Closes after the job reaches a terminal state.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      summary: |-
        Stream a job's status transitions as Server-Sent Events until it reaches a
        terminal state. Lets clients await completion without polling the REST
        endpoint themselves.
      tags:
      - jobs
  /api/v1/jobs/{id}/fail:
    post:
      operationId: failJob
      parameters:
      - description: Job id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailJobRequest'
        required: true
      responses:
        "204":
          description: Failure recorded; the job is retried or dead-lettered per its
            config
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: "Authenticated, but not with the worker credential"
        "404":
