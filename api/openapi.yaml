            created_at: 2000-01-23T04:56:07.000+00:00
            scheduled_at: 2000-01-23T04:56:07.000+00:00
            delivery_count: 0
            queue_name: queue_name
            result:
              key: ""
            completed_at: 2000-01-23T04:56:07.000+00:00
            payload:
              key: ""
            retry_count: 0
            idempotency_key: idempotency_key
            next_retry_at: 2000-01-23T04:56:07.000+00:00
            started_at: 2000-01-23T04:56:07.000+00:00
            id: id
            workflow_step_id: workflow_step_id
            config:
              max_retries: 0
              retry_max_delay_secs: 0
              retry_backoff: fixed
              priority: 1
              retry_delay_secs: 0
              jitter_factor: 0.8008281904610115
              timeout_secs: 0
            status: pending
        - lease_token: lease_token
          job:
            error_message: error_message
            task_name: task_name
            tenant_id: tenant_id
            metadata:
              key: ""
            workflow_id: workflow_id
            created_at: 2000-01-23T04:56:07.000+00:00
            scheduled_at: 2000-01-23T04:56:07.000+00:00
            delivery_count: 0
            queue_name: queue_name
            result:
              key: ""
            completed_at: 2000-01-23T04:56:07.000+00:00
            payload:
              key: ""
            retry_count: 0
            idempotency_key: idempotency_key
            next_retry_at: 2000-01-23T04:56:07.000+00:00
            started_at: 2000-01-23T04:56:07.000+00:00
            id: id
            workflow_step_id: workflow_step_id
            config:
              max_retries: 0
              retry_max_delay_secs: 0
              retry_backoff: fixed
              priority: 1
              retry_delay_secs: 0
              jitter_factor: 0.8008281904610115
              timeout_secs: 0
            status: pending
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/LeasedJob'
          type: array
      required:
      - jobs
    LeasedJob:
      description: |-
        A job leased to a (possibly remote) worker, together with the lease token
        needed to heartbeat, complete, or fail it.
      example:
        lease_token: lease_token
        job:
          error_message: error_message
          task_name: task_name
          tenant_id: tenant_id
          metadata:
            key: ""
          workflow_id: workflow_id
          created_at: 2000-01-23T04:56:07.000+00:00
          scheduled_at: 2000-01-23T04:56:07.000+00:00
          delivery_count: 0
          queue_name: queue_name
          result:
            key: ""
          completed_at: 2000-01-23T04:56:07.000+00:00
          payload:
            key: ""
          retry_count: 0
          idempotency_key: idempotency_key
          next_retry_at: 2000-01-23T04:56:07.000+00:00
          started_at: 2000-01-23T04:56:07.000+00:00
          id: id
          workflow_step_id: workflow_step_id
          config:
            max_retries: 0
            retry_max_delay_secs: 0
            retry_backoff: fixed
            priority: 1
            retry_delay_secs: 0
            jitter_factor: 0.8008281904610115
            timeout_secs: 0
          status: pending
      properties:
        job:
          $ref: '#/components/schemas/Job'
        lease_token:
          description: |-
