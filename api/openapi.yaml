      description: "Pause or resume outcome: the queue's live counts with its new\
        \ flag."
      example:
        running: 0
        paused: true
        pending: 0
        queue: queue
      properties:
        paused:
          description: Claims of the caller's jobs on this queue are paused.
          type: boolean
        pending:
          description: Claimable jobs of the caller waiting on this queue.
          format: int64
          minimum: 0
          type: integer
        queue:
          type: string
        running:
          description: |-
            Jobs of the caller still leased by workers. A paused queue is drained
