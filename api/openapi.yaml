  /api/v1/workflows/{id}/events:
    get:
      operationId: streamWorkflowEvents
      parameters:
      - description: Workflow id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WorkflowEvent'
          description: "SSE stream; each `status` event carries a WorkflowEvent (the\
            \ workflow status and every step's state). The first event is the current\
            \ state; the stream closes after the terminal one, or after 15 minutes\
            \ (reconnect to keep following)."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
      security:
      - bearerAuth: []
      summary: |-
        Stream a workflow's progress as Server-Sent Events: one `status` event
        whenever the workflow or any step changes, until the workflow is
        terminal.
      tags:
      - workflows
  /api/v1/workflows/{id}/retry:
    post:
      operationId: retryWorkflow
      parameters:
      - description: Workflow id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: "The workflow is running again: every step that did not complete\
            \ went back to pending and is re-scheduled; completed steps keep their\
            \ results. The deadline, if any, is re-armed from the original timeout."
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: The workflow is running or completed
      security:
      - bearerAuth: []
      tags:
      - workflows
  /api/v1/workflows/{id}/steps:
