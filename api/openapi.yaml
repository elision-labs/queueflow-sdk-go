    JobConfig:
      description: |-
        Per-job execution configuration. All durations are in seconds.

        Deserialization is partial-friendly: any omitted field takes its
        [`JobConfig::default`] value (via per-field serde defaults), so
        workflow-step and cron config overrides can name just the fields they
        change, and out-of-band rows with sparse `config` JSONB still load.
        Per-field functions rather than a struct-level `#[serde(default)]`:
        the struct-level form makes utoipa attach a `default` beside the
        `BackoffStrategy` `$ref`, which forces a synthetic wrapper type into
        every generated SDK.
      example:
        max_retries: 0
        retry_max_delay_secs: 0
        retry_backoff: fixed
        priority: 1
        retry_delay_secs: 0
        jitter_factor: 0.8008281904610115
        timeout_secs: 0
      properties:
        jitter_factor:
          description: |-
            Optional jitter in `0.0..=1.0`. `0.1` => +/-10% randomization of each
            retry delay, which spreads out thundering-herd retries.
          format: double
          nullable: true
          type: number
        max_retries:
          format: int32
          minimum: 0
          type: integer
        priority:
          description: |-
            Higher is claimed first within a queue; ties break on `scheduled_at`,
            then `created_at`.
          format: int32
          type: integer
        retry_backoff:
          $ref: '#/components/schemas/BackoffStrategy'
        retry_delay_secs:
          format: int64
          minimum: 0
          type: integer
        retry_max_delay_secs:
          format: int64
          minimum: 0
          type: integer
        timeout_secs:
          format: int64
          minimum: 0
          type: integer
    JobConfigRequest:
      description: Optional per-job configuration overrides.
      example:
        max_retries: 0
        retry_max_delay_secs: 0
        retry_backoff: fixed
        priority: 1
        retry_delay_secs: 0
        jitter_factor: 0.8008281904610115
        queue: queue
        timeout: 0
      properties:
        jitter_factor:
          description: Retry-delay jitter in `0.0..=1.0` (e.g. `0.1` = +/-10%).
          format: double
          nullable: true
          type: number
        max_retries:
          format: int32
          minimum: 0
          nullable: true
          type: integer
        priority:
          description: "Higher is claimed first within a queue (ties: oldest first)."
          format: int32
          nullable: true
          type: integer
        queue:
          description: Override the destination queue.
          nullable: true
          type: string
        retry_backoff:
          $ref: '#/components/schemas/BackoffStrategy'
        retry_delay_secs:
          description: "Base retry delay, in seconds."
          format: int64
          minimum: 0
          nullable: true
          type: integer
        retry_max_delay_secs:
          description: "Upper bound on any computed retry delay, in seconds."
          format: int64
          minimum: 0
          nullable: true
          type: integer
        timeout:
          description: "Per-attempt timeout, in seconds."
          format: int64
          minimum: 0
          nullable: true
          type: integer
