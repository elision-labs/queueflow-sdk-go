name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go vet ./...
      # Offline tests only: the live conformance suite (live_test.go) skips
      # itself without QUEUEFLOW_URL and is driven from the queueflow-core
      # repo's CI.
      - run: go test ./...
